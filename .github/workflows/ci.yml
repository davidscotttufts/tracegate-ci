name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - run: npm run test:sabotage
      - run: npm run test:e2e

  # The recorder hooks a Vitest internal (vm.runInThisContext). Every supported
  # Vitest version must keep the seam mapped, or the matrix fails.
  vitest-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test:vitest-matrix

  # The same end-to-end on examples/sample-repo-jest (Jest 30, babel-jest), seam strictly mapped.
  e2e-jest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test:e2e-jest

  # TypeScript 7 (the native compiler) has no JS parser API. A repository on 7
  # installs 6 beside it as `tracegate-typescript`; the same end-to-end must pass.
  e2e-typescript-7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: TYPESCRIPT_VERSION=7 TS_ALIAS_VERSION=6 npm run test:e2e

  # Tracegate vs Vitest recordDependencies on the same commits; every selection is asserted.
  compare-vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test:compare

  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm pack --dry-run
