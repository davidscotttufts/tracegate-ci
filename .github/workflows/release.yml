name: release
# Stages a release on npm when a maintainer pushes a tag vX.Y.Z that matches package.json.
# Auth is npm Trusted Publishing (OIDC): no token secret. The release goes live only
# after a maintainer approves it with 2FA: `npm stage list` / `npm stage approve <id>`.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm Trusted Publishing (OIDC) and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm test
      - run: npm run test:sabotage
      - run: npm install -g npm@latest # `npm stage` needs npm >= 11.15
      - run: npm stage publish --access public
